[project]
name = "computational-physics-lab"
version = "1.0.0"
description = "A computational physics workbench: numerical methods for physics, implemented from first principles in pure Python (developed for NISER PHY341/745)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Runtime dependencies are visualization + test tooling only.
# The numerical core (mylib.py) is pure standard library.
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 95
target-version = "py310"
extend-exclude = ["assignments/*/mylib.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines (mathematical expressions)
    "B008",  # function calls in default arguments (readability in drivers)
    "B905",  # zip() strict= (sequence sizes are structurally equal)
]

[tool.ruff.lint.per-file-ignores]
# Assignment front-code deliberately keeps teaching-style simplicity.
"assignments/**" = ["E731"]
"tests/**" = ["E731"]
